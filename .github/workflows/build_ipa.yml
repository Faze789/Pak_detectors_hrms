name: Build iOS IPA (Unsigned)

# This trigger allows you to run the workflow manually from the GitHub UI
on:
  workflow_dispatch: 

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        # This builds the raw iOS app bundle without needing Apple certificates
        run: flutter build ios --release --no-codesign

      - name: Package into IPA for Sideloadly
        # Sideloadly requires the app to be inside a 'Payload' folder, zipped into an .ipa
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -qq -r app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrms_app_release
          path: app.ipa
          retention-days: 3 # Deletes the artifact after 3 days to save GitHub storage space